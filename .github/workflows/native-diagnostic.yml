name: Native sanitizer diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubsan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-native.py --algorithm nfiq2 --sanitizer ubsan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubsan-diagnostics-${{ matrix.os }}
          path: artifacts/sanitizers/
